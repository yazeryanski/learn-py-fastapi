[project]
name = "learn-py-fastapi"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "faker>=40.63.0",
    "fastapi[standard]>=0.165.0",
    "pydantic>=2.14.4",
]
[tool.fastapi]
entrypoint = "src.main:app"
[tool.pyright]
typeCheckingMode = "strict"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportMissingParameterType = "warning"